---
- name: check for the user unit
  ansible.builtin.stat:
    path: "{{ wc_fuse_home }}/.config/systemd/user/wc-fuse.service"
  register: wc_fuse_user_unit

- name: stop and disable the user daemon
  ansible.builtin.systemd_service:
    name: wc-fuse.service
    scope: user
    state: stopped
    enabled: false
    daemon_reload: true
  when: wc_fuse_user_unit.stat.exists

- name: remove the user unit and the daemon binary
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ wc_fuse_home }}/.config/systemd/user/wc-fuse.service"
    - "{{ wc_fuse_bin }}"

- name: list live wc-fuse mounts
  ansible.builtin.command: findmnt -rn -o TARGET --source wc-fuse
  register: wc_fuse_mounts
  changed_when: false
  failed_when: false

- name: unmount the workspace mounts
  ansible.builtin.command: fusermount3 -uz {{ item }}
  loop: "{{ wc_fuse_mounts.stdout_lines | default([]) }}"
  changed_when: true
  failed_when: false
