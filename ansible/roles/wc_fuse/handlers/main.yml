---
- name: restart the root setup unit
  ansible.builtin.systemd_service:
    name: wc-fuse-root.service
    daemon_reload: true
    enabled: true
    state: restarted
  when: not ansible_check_mode

- name: restart the user daemon
  ansible.builtin.systemd_service:
    name: wc-fuse.service
    scope: user
    daemon_reload: true
    enabled: true
    state: restarted
  when: not ansible_check_mode
