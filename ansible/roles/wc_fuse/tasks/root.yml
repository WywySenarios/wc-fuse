---
- name: allow unprivileged allow_other mounts
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: "^user_allow_other"
    line: user_allow_other
    create: true
    mode: "0644"

- name: install the tmpfiles snippet
  ansible.builtin.template:
    src: wc.conf.j2
    dest: /etc/tmpfiles.d/wc.conf
    owner: root
    group: root
    mode: "0644"
  register: wc_fuse_tmpfiles

- name: check the /dev/wc tree
  ansible.builtin.stat:
    path: /dev/wc/control
  register: wc_fuse_tree

- name: create the /dev/wc tree
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/wc.conf
  when: wc_fuse_tmpfiles.changed or not wc_fuse_tree.stat.exists

- name: install the root setup unit
  ansible.builtin.template:
    src: wc-fuse-root.service.j2
    dest: /etc/systemd/system/wc-fuse-root.service
    owner: root
    group: root
    mode: "0644"
  notify: restart the root setup unit

- name: read the linger state
  ansible.builtin.command: loginctl show-user {{ wc_fuse_user }} --property=Linger --value
  register: wc_fuse_linger
  changed_when: false

- name: enable login linger
  ansible.builtin.command: loginctl enable-linger {{ wc_fuse_user }}
  when: wc_fuse_linger.stdout | trim != 'yes'

- name: ensure the policy directory exists
  ansible.builtin.file:
    path: "{{ wc_fuse_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: copy the policy files
  ansible.builtin.copy:
    src: "wc-config/{{ item }}"
    dest: "{{ wc_fuse_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - fs.yaml
    - project-roots.yaml

# Migration: earlier revisions cloned the policy into this directory.
- name: drop the submodule metadata from the policy copy
  ansible.builtin.file:
    path: "{{ wc_fuse_config_dir }}/.git"
    state: absent

- name: start and enable the root setup unit
  ansible.builtin.systemd_service:
    name: wc-fuse-root.service
    daemon_reload: true
    enabled: true
    state: started
  when: not ansible_check_mode
